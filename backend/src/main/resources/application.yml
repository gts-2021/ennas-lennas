server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ennas-lennas-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/ennas_lennas_db
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

ennas:
  security:
    jwt:
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration-ms: 86400000 # 24 hours
  minio:
    url: ${MINIO_URL:http://localhost:9008}
    access-key: ${MINIO_KEY:n62JqnPRXJRV2JAHDCg8}
    secret-key: ${MINIO_SECRET:XgySJpBcz2wU6NSlF3cvpXK87CUDFj4Q6ZOcrysy}
    bucket-name: ennas-lennas-documents
